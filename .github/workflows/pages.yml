# 기본 브랜치에 올라갈 때마다 GitHub Pages 로 내보낸다.
# 저장소에 Pages 가 아직 안 켜져 있으면 configure-pages 가 켜준다.
name: Pages

on:
  push:
    branches: [main, claude/text-paste-input-mode-f3jw1h, claude/work-request-odmwi6]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 테스트
        run: npm test
      - name: 한 파일 버전도 최신인지 확인
        run: |
          node build.js
          git diff --exit-code -- dist/crew-cal.html

      # 임장 노트(imjang/)는 빌드가 필요한 별도 앱이다. /imjang/ 아래로 함께 내보낸다.
      - name: 임장 노트 빌드
        working-directory: imjang
        run: |
          npm ci
          npm test
          npm run build

      - name: 사이트 모으기
        run: |
          mkdir -p _site
          tar -cf - --exclude=./.git --exclude=./_site --exclude=./imjang . | (cd _site && tar -xf -)
          mkdir -p _site/imjang
          cp -r imjang/dist/. _site/imjang/

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
