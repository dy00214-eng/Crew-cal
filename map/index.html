<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가본 도시 · 크루캘</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%2333456e%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%229%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%222%22/%3E%3Cpath d=%22M16 7c4 4 4 14 0 18M16 7c-4 4-4 14 0 18M7.5 16h17%22 stroke=%22%23fff%22 stroke-width=%221.6%22 fill=%22none%22/%3E%3C/svg%3E">
<meta name="description" content="크루캘에 넣어 둔 스케줄로 다녀온 도시를 세계지도에 찍어 봅니다. 일정은 이 기기에만 저장됩니다.">
<meta name="theme-color" content="#f7f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141310" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="map.css">
</head>
<body class="map-body">
<header class="app-header">
  <h1>가본 도시</h1>
  <div class="month-nav">
    <a class="back-link" href="../">← 크루캘</a>
  </div>
</header>

<main class="layout">
  <section class="card map-card">
    <div class="seg" id="yearSeg" role="group" aria-label="기간 고르기"></div>

    <p class="map-headline" id="headline">불러오는 중…</p>
    <p class="map-sub" id="subline"></p>

    <div class="map-frame">
      <canvas id="mapCanvas" aria-label="다녀온 도시를 찍은 세계지도"></canvas>
    </div>

    <div class="data-tools">
      <button type="button" id="saveBtn" class="ghost small">이미지로 저장</button>
      <button type="button" id="loadBtn" class="ghost small">백업 파일로 보기</button>
      <input type="file" id="loadInput" accept="application/json" hidden>
    </div>

    <div class="empty-note" id="emptyNote" hidden>
      <p><b>아직 넣어 둔 일정이 없습니다.</b></p>
      <p>
        <a href="../">크루캘</a>에 스케줄을 붙여넣으면 이 지도가 저절로 채워집니다.
        다른 기기에서 쓰던 일정이라면 크루캘의 <b>백업 내보내기</b>로 받은 파일을
        위 <b>백업 파일로 보기</b>에 넣어도 됩니다. 파일은 보기만 하고 저장하지 않습니다.
      </p>
    </div>
  </section>

  <section class="card place-card" id="placeCard" hidden>
    <h2 class="place-head">다녀온 곳</h2>
    <ol class="place-list" id="placeList"></ol>
    <p class="muted small-note">
      횟수는 한국에서 출발한 편만 셉니다. 거리는 실제로 탄 모든 편을 대권 거리로 더한 값이라
      실제 비행 거리와는 조금 다를 수 있습니다.
    </p>
  </section>
</main>

<footer class="app-footer">
  <p>일정은 이 기기에만 저장됩니다 · <a href="../">크루캘로 돌아가기</a></p>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="../src/codes.js"></script>
<script src="../src/airports.js"></script>
<script src="../src/holidays-lunar.js"></script>
<script src="../src/holidays.js"></script>
<script src="../src/schedule.js"></script>
<script src="../src/store.js"></script>
<script src="../src/calendar.js"></script>
<script src="../src/geo.js"></script>
<script src="../src/worldmap.js"></script>
<script src="../src/journeys.js"></script>
<script src="../src/mapdraw.js"></script>
<script src="map.js"></script>
</body>
</html>
